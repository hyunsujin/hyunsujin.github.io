<!doctype html>
<!-- Used by tools/build.sh: opens a page, lets js/ draw it, and prints the
     drawn HTML of each container as JSON so it can be saved into the page. -->
<html><head><meta charset="utf-8"></head><body>
<pre id="out"></pre>
<iframe id="frame" style="width:1300px;height:900px"></iframe>
<script>
  const CONTAINERS = {
    "index.html": ["topbar", "sidebar", "top", "research", "venture", "publications", "patents", "archive", "cv", "footer"],
    "stress-prediction.html": ["topbar", "sidebar", "project", "footer"],
  };
  const page = new URLSearchParams(location.search).get("page");
  const frame = document.getElementById("frame");
  frame.src = "../" + page;
  frame.onload = () =>
    setTimeout(() => {
      const d = frame.contentDocument;
      const out = {};
      for (const id of CONTAINERS[page]) {
        const el = d.getElementById(id);
        if (!el) continue;
        const copy = el.cloneNode(true);
        // state added by scripts after drawing
        copy.querySelectorAll(".reveal, .is-visible, .is-active").forEach((n) =>
          n.classList.remove("reveal", "is-visible", "is-active")
        );
        // the animated staff is drawn by js/staff.js (its shape changes every frame)
        copy.querySelectorAll("#staff").forEach((svg) => { svg.innerHTML = ""; svg.removeAttribute("viewBox"); });
        // the poster shelf is rebuilt by js/shelf.js; save a plain list instead of 36 3D tapes
        copy.querySelectorAll("[data-shelf]").forEach((shelf) => {
          const ch = frame.contentWindow.SITE.archive.chapters.find((c) => c.id === shelf.dataset.shelf);
          const esc = frame.contentWindow.Components.esc;
          shelf.innerHTML = `<ol class="visually-hidden">${ch.items
            .map((it) => `<li>${esc([it.title, it.year, it.place].filter(Boolean).join(", "))}</li>`)
            .join("")}</ol>`;
        });
        out[id] = copy.innerHTML.trim();
      }
      document.getElementById("out").textContent = JSON.stringify(out);
    }, 1500);
</script>
</body></html>
